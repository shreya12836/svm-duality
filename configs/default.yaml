# Every hyperparameter and the random seed for `python run_experiment.py`.
# Relative paths are resolved against the repository root.

seed: 42
output_dir: results

data:
  path: data/raw/banknote_authentication.csv
  sha256: d0539aaed2139ba7a587b3e34fb345ce503ff7d5d33dbf9912d8e195ce425cb9
  features: [variance, skewness, curtosis, entropy]
  val_fraction: 0.2    # 60 / 20 / 20 stratified split after deduplication
  test_fraction: 0.2   # untouched until the final evaluation

selection:
  # Sensitivity grid (also used for model selection on the validation split).
  C_grid: [0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30, 100, 300, 1000]
  gamma_grid: [0.01, 0.03, 0.1, 0.3, 1, 3, 10]
  # null = choose by validation balanced accuracy; a number fixes the value.
  linear_C: null
  rbf_C: null
  rbf_gamma: null

solvers:
  cvx_solver: CLARABEL   # interior-point solver for the exact primal and dual
  smo_tol: 1.0e-5        # stop when m(a) - M(a) < smo_tol
  smo_max_iter: 300000
  pegasos_epochs: 50     # fixed budget: T = epochs * n stochastic steps
  pegasos_seeds: 5       # Pegasos is re-run with seeds seed .. seed+4 (mean / sd reported)
  timing_repeats: 3      # runtime = median over repeats, after a warm-up solve

evaluation:
  bootstrap_resamples: 2000   # 95% CI for test balanced accuracy

plots:
  # 2-D models used only for the geometry figures.
  features: [variance, skewness]
  linear_C: 1.0
  rbf_C: 1.0
  rbf_gamma: 0.5
